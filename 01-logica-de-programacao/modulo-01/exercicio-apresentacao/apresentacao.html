<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Perfil</title>
  </head>

  <body>
    <h1>Apresentação Pessoal</h1>
    <p id="resultado"></p>

    <script>
      const name = prompt('Informe o seu nome: ') || 'Desconhecido';
      const age = Number(prompt('Informe a sua idade: '));
      const city = prompt('Informe a cidade onde mora: ') || 'Não informada';
      const validAge = !isNaN(age) && age > 0 ? age : 0;
      const message = `Nome: ${name}
Idade: ${validAge}
Cidade: ${city}`;

      document.getElementById('resultado').innerText = message;
    </script>
  </body>
</html>
